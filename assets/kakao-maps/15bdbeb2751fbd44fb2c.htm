<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>카카오맵 위치 안내</title><style>html,body{margin:0;padding:0;width:100%;font-family:system-ui,sans-serif}body{min-height:360px;background:#f4f7f3;color:#365449}p{margin:0;padding:24px;font-size:15px;line-height:1.7}</style></head><body><p role="status">카카오 지도를 준비하고 있습니다.</p><script type="application/json" id="kakao-map-document">"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"robots\" content=\"noindex,follow\">\u003ctitle>삼산점 카카오맵 위치 안내\u003c/title>\u003cstyle>html,body{margin:0;padding:0;width:100%;font-family:system-ui,sans-serif}html{overflow:hidden}*{box-sizing:border-box}.root_daum_roughmap{width:100%!important;max-width:100%;border:0!important}.root_daum_roughmap .wrap_map{width:100%!important;height:360px!important}\u003c/style>\u003c!-- kakaomap-map-only-style:start -->\u003cstyle>\n/* Keep the interactive map and its attribution; omit the outbound toolbar and detail panel. */\n.root_daum_roughmap > .wrap_controllers,.root_daum_roughmap > .cont{display:none!important}\n.root_daum_roughmap .wrap_map a{cursor:default}\n\u003c/style>\u003c!-- kakaomap-map-only-style:end -->\u003c/head>\u003cbody>\u003c!-- kakaomap-original:start -->\u003c!--\n\t* 카카오맵 - 약도서비스\n\t* 한 페이지 내에 약도를 2개 이상 넣을 경우에는\n\t* 약도의 수 만큼 소스를 새로 생성, 삽입해야 합니다.\n-->\n\u003c!-- 1. 약도 노드 -->\n\u003cdiv id=\"daumRoughmapContainer1791972774809\" class=\"root_daum_roughmap root_daum_roughmap_landing\">\u003c/div>\n\n\u003c!-- 2. 설치 스크립트 -->\n\u003cscript charset=\"UTF-8\" class=\"daum_roughmap_loader_script\" src=\"https://t1.kakaocdn.net/kakaomapweb/roughmap/loader/prod/roughmapLoader.js\">\u003c/script>\n\n\u003c!-- 3. 실행 스크립트 -->\n\u003cscript charset=\"UTF-8\">\n\tnew daum.roughmap.Lander({\n\t\t\"timestamp\" : \"1791972774809\",\n\t\t\"key\" : \"39snaptti23\",\n\t\t\"mapWidth\" : \"640\",\n\t\t\"mapHeight\" : \"360\"\n\t}).render();\n\u003c/script>\u003c!-- kakaomap-original:end -->\u003cscript>(()=>{let lastHeight=0;const report=()=>{const root=document.querySelector('.root_daum_roughmap');if(!root)return;const height=Math.ceil(root.getBoundingClientRect().height);if(height\u003c360||height===lastHeight)return;lastHeight=height;parent.postMessage({type:'wawa:kakao-map-size',timestamp:root.id.replace('daumRoughmapContainer',''),height},location.origin)};const start=()=>{new ResizeObserver(report).observe(document.body);report()};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();addEventListener('load',report);addEventListener('message',event=>{if(event.origin===location.origin&&event.source===parent&&event.data?.type==='wawa:kakao-map-measure'){lastHeight=0;report()}})})();\u003c/script>\u003c!-- kakaomap-map-only-script:start -->\u003cscript>(()=>{\n  const root=document.querySelector('.root_daum_roughmap');if(!root)return;\n  // Keep label text and the provider logo intact, without navigation or a new window.\n  const unlink=anchor=>{\n    if(anchor.hasAttribute('href'))anchor.removeAttribute('href');\n    if(anchor.hasAttribute('target'))anchor.removeAttribute('target');\n    if(anchor.hasAttribute('onclick'))anchor.removeAttribute('onclick');\n    const logo=anchor.querySelector('img[alt=\"Kakao 맵으로 이동(새창열림)\"]');\n    if(logo)logo.alt='Kakao 지도';\n  };\n  const clean=node=>{if(!(node instanceof Element))return;if(node.matches('a'))unlink(node);node.querySelectorAll('a').forEach(unlink)};\n  clean(root);\n  new MutationObserver(records=>{for(const record of records){if(record.type==='attributes')clean(record.target);else record.addedNodes.forEach(clean)}}).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['href','target','onclick']});\n  const stayOnMap=event=>{if(event.target instanceof Element&&event.target.closest('a')){event.preventDefault();event.stopImmediatePropagation()}};\n  root.addEventListener('click',stayOnMap,true);\n  root.addEventListener('auxclick',stayOnMap,true);\n  root.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' ')stayOnMap(event)},true);\n})();\u003c/script>\u003c!-- kakaomap-map-only-script:end -->\u003c/body>\u003c/html>"</script><script>(()=>{let started=false;const activate=()=>{if(started)return;started=true;const source=JSON.parse(document.getElementById('kakao-map-document').textContent);document.open();document.write(source);document.close()};if(parent===window){activate();return}addEventListener('message',event=>{if(event.origin===location.origin&&event.source===parent&&event.data?.type==='wawa:kakao-map-activate')activate()});parent.postMessage({type:'wawa:kakao-map-ready',timestamp:"1791972774809"},location.origin)})();</script></body></html>
